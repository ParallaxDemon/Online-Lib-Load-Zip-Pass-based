name: Build signed release APKs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 'PARALLAX 🔥'
            artifact: 'Parallax-Loader-release'
          - project: 'Parallax Papa ENC'
            artifact: 'Parallax-Config-release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK components
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Prepare build directory
        run: |
          mkdir -p build-src
          cp -a "${{ matrix.project }}" build-src/Project
          cp -a native build-src/native
      - name: Inject loader archive configuration
        if: matrix.artifact == 'Parallax-Loader-release'
        env:
          PARALLAX_URL_HEX: ${{ secrets.PARALLAX_URL_HEX }}
          PARALLAX_PASSWORD_HEX: ${{ secrets.PARALLAX_PASSWORD_HEX }}
        run: python3 .github/scripts/inject-loader-config.py
      - name: Build release
        run: gradle -p build-src/Project --no-daemon :app:assembleRelease
      - name: Sign and verify installable release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          KEYSTORE="$RUNNER_TEMP/temporary-release.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass 'temporary-build-only' -keypass 'temporary-build-only' -alias release -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Parallax Temporary Build'
          "$BUILD_TOOLS/zipalign" -f -p 4 build-src/Project/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias release --ks-pass pass:temporary-build-only --key-pass pass:temporary-build-only --out "$RUNNER_TEMP/release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/release.apk
          if-no-files-found: error
