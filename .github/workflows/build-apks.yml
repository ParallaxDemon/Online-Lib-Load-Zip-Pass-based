name: Build both Android APKs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 'PARALLAX 🔥'
            artifact: 'Parallax-Loader-debug'
          - project: 'Parallax Papa ENC'
            artifact: 'Parallax-Config-debug'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-33' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Prepare ASCII build directory
        run: |
          mkdir -p build-src
          cp -a "${{ matrix.project }}" build-src/Project
          cp -a native build-src/native
      - name: Assemble APK
        run: gradle -p build-src/Project --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build-src/Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
